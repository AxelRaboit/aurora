  parameters:
    media_credit_visible:
      label: Show photo credits
      off_warning: "The Pexels API guidelines ask you to credit the photographer and link to Pexels for photos imported with your key. Hiding the credit steps outside those guidelines, on your own account. The photo licence itself does not require attribution."
      description: "Shows the photographer's name and a link to the stock library under the pictures that carry one. The Pexels API guidelines ask for this credit: switching it off is your decision about your own account."
    captcha:
      title: Anti-robot check
      intro: "One more check on anything a visitor can send, comments and forms alike, on top of the honeypot, the link filter, the flood limit and the moderation already there."
      privacy: "The chosen service receives the visitor's IP address. That is personal data: the account should be the site's own, and the privacy notice should say so."
      enabled: Turn the check on
      provider: Service
      site_key: Site key
      site_key_placeholder: '0x4AAAAAAA…'
      site_key_hint: "Printed in the page, by design: the widget needs it."
      secret_key: Secret key
      secret_key_placeholder: '0x4AAAAAAA…'
      secret_key_hint: "Encrypted at rest. Left empty, the stored key is kept."
      secret_set: A secret key is stored.
      secret_unset: No secret key stored.
      providers:
        turnstile: "Cloudflare Turnstile (recommended: no puzzle, no advertising cookie)"
        recaptcha: "Google reCAPTCHA v3 (invisible, scores from 0 to 1)"
      errors:
        keys_required: "Both keys are required to turn the check on."
    site_name:
      label: Site name
      description: Name displayed on the public site and in emails
      placeholder: My company
    site_description:
      label: Site description
      description: Short description used as the default meta description
      placeholder: Multi-module business management platform
    site_url:
      label: Public site URL
      description: 'Absolute URL of the site (no trailing slash), used in emails and the sitemap'
      placeholder: 'https://app.example.com'
    admin_email:
      label: Administrator email
      description: Email address of the administrator
      placeholder: 'admin@example.com'
    default_locale:
      label: Default locale
      description: 'Default language of the site (public display, fallback email locale).'
    single_locale_mode:
      label: Single-locale mode
      description: "If enabled, the application only displays and stores a single language (the one defined by 'Default locale'). Multi-language tabs are hidden and URLs with a different language code are redirected (301). Reversible: content entered in other languages remains in the database."
    posts_per_page:
      label: Posts per page
      description: Number of posts displayed per page on public lists
      placeholder: 10
    max_upload_size_mb:
      label: Max upload size (MB)
      description: 'Maximum allowed size for a media upload, in megabytes'
      placeholder: 8
    allowed_upload_extensions:
      label: Allowed extensions
      description: 'Comma-separated list of allowed extensions (jpg,png,pdf,…)'
      placeholder: jpg,jpeg,png,gif,webp,pdf
    timezone:
      label: Timezone
      description: PHP timezone (e.g. Europe/Paris)
    date_format:
      label: Date display format
      description: Date display format (e.g. d/m/Y)
    comments_enabled:
      label: Comments enabled
      description: 'If enabled, visitors can leave comments on public articles.'
    comment_moderation_enabled:
      label: Comment moderation
      description: 'If enabled, comments await moderation before publication. If disabled, they are automatically approved.'
    maintenance_mode:
      label: Maintenance mode
      description: 'If enabled, the public site is closed to visitors and displays a maintenance page.'
    admin_registration_enabled:
      label: Admin registrations open
      description: Allow registrations via /register (admin interface). Disable after creating the first admin account.
    admin_access_request_enabled:
      label: Admin access requests open
      description: Allow access requests via /access-request (access request form for the administration)
    front_login_enabled:
      label: Front-end login enabled
      description: "If disabled, the public site has no accounts at all: login, registration, the account area and password reset return 404, and the matching menu links disappear. Turn it off for a brochure-only application."
    front_registration_enabled:
      label: Front-end registrations open
      description: 'If enabled, visitors can create an account from the public site. No effect when front-end login is disabled.'
    post_revisions_limit:
      label: Post revisions kept
      description: Maximum number of revisions kept per post (oldest are deleted)
    file_versions_limit:
      label: File versions kept
      description: Maximum number of versions kept per GED file. Beyond that, the oldest are deleted along with their file. 0 = unlimited.
    trash_auto_purge_days:
      label: Auto-purge trash (days)
      description: Number of days before permanent deletion of trashed posts (0 = never)
    homepage_post_id:
      label: Homepage post ID
      description: ID of a post displayed on the homepage. Empty = latest posts list.
    default_front:
      label: Default front
      description: 'Slug of the front displayed by default on "/".'
    logo_media_id:
      label: Site logo
      description: ID of the media used as the logo
    favicon_media_id:
      label: Favicon
      description: ID of the media used as the favicon
    seo_title_template:
      label: SEO title template
      description: 'Template for page titles. Use {title} and {siteName}. E.g. {title} · {siteName}'
      placeholder: '{title} · {siteName}'
    seo_default_description:
      label: Default SEO description
      description: Meta description used when no specific description is defined
      placeholder: "Business management platform : CRM, sales, document management…"
    seo_default_og_image:
      label: Default Open Graph image
      description: Image used for social previews (Facebook, LinkedIn, Twitter…) when the page doesn't define one. 1200×630 px recommended.
    seo_twitter_handle:
      label: Twitter / X handle
      description: 'Twitter handle of the site (with @, e.g.: @aurora_app). Used in the twitter:site Twitter Cards meta tag.'
      placeholder: '@aurora_app'
    email_locale:
      label: Forced email locale
      description: 'Language used for all outgoing emails. "Follow default locale" applies the site default locale.'
    email_locale_auto: Follow default locale
    core_user_prefix:
      label: User reference prefix
      description: Auto-generated reference prefix (e.g. XXX). Leave empty to disable.
    core_media_prefix:
      label: Media reference prefix
      description: Auto-generated reference prefix (e.g. XXX). Leave empty to disable.
    core_access_request_prefix:
      label: Access request reference prefix
      description: Auto-generated reference prefix (e.g. XXX). Leave empty to disable.
    core_audit_log_prefix:
      label: Audit log prefix
      description: Auto-generated reference prefix (e.g. XXX). Leave empty to disable.
    core_reset_password_prefix:
      label: Password reset request prefix
      description: Auto-generated reference prefix (e.g. XXX). Leave empty to disable.
    core_media_folder_prefix:
      label: Media folder reference prefix
      description: Auto-generated reference prefix (e.g. XXX). Leave empty to disable.
    core_menu_item_prefix:
      label: Menu item reference prefix
      description: Auto-generated reference prefix (e.g. XXX). Leave empty to disable.
    accounting_contract_prefix:
      label: Contract reference prefix
      description: 'Prefix of contract references. CTR by default, which gives CTR-2026-0001.'
    accounting_provider_name:
      label: Provider's trading name
      description: 'The name you contract under, as it prints at the top of the contract.'
    accounting_provider_representative:
      label: Name
      description: 'The individual who signs. Printed alongside the trading name.'
    accounting_provider_address:
      label: Business address
      description: 'The full address on one line: it appears in the contract''s identity block.'
    accounting_provider_siret:
      label: SIRET
      description: 'The SIRET of the establishment that contracts.'
    accounting_provider_ape_code:
      label: APE code
      description: 'Code and wording, for instance 7021Z - public relations and communication consultancy.'
    accounting_provider_vat_mention:
      label: VAT wording
      description: 'The exact sentence to print, for instance "not liable - VAT not applicable, art. 293 B of the CGI".'
    accounting_provider_email:
      label: Email
      description: 'The address a customer writes to under the contract.'
    accounting_provider_phone:
      label: Phone
      description: 'The number printed in the identity block.'
    accounting_provider_bank_holder:
      label: Account holder
      description: 'The holder''s name, as it appears on the statement.'
    accounting_provider_bank_iban:
      label: IBAN
      description: 'The IBAN printed in the contract''s financial terms.'
    accounting_provider_bank_bic:
      label: BIC
      description: 'The bank''s BIC.'
    accounting_provider_bank_name:
      label: Bank
      description: 'The bank''s name, and its address if you print it.'
    accounting_contract_retention_years:
      label: Retention (years)
      description: 'How many years a sealed contract is kept before it can be deleted. Five years is the legal floor, ten are advised for a service provider; under five, the value is raised back to five.'
    accounting_contract_reminder_enabled:
      label: Chase automatically
      description: 'Emails a reminder for contracts sent and not signed. Every reminder mints a new signing address and invalidates the previous one, exactly like a manual resend.'
    accounting_contract_reminder_days:
      label: Days between reminders
      description: 'Days without an answer before a reminder goes out. Counted from the last send, not from the seal.'
    accounting_contract_reminder_max:
      label: Maximum number of reminders
      description: 'Past that, the contract is left alone. Silence is an answer too.'
    nav_section_aliases:
      label: Navigation section aliases
      description: JSON map of section aliases (managed via the UI).
    nav_item_aliases:
      label: Navigation item aliases
      description: JSON map of menu item aliases (managed via the UI).
    color_picker_presets:
      label: Color picker palette
      description: JSON list of hex colors offered as quick-pick swatches in every admin color selector.
    intro: View and edit the application technical parameters.
    key: Parameter
    value: Value
    description: Description
